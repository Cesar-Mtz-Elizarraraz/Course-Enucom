<div class="container">
    <div class="card">
        <div class="card-header">
            <h2>Nueva Computadora</h2>
        </div>
        <div class="card-body">
            <th>Ingresa los datos de la nueva computadora</th>
            <!-- ngModel: es una directiva en ANgular que proporciona en enlace bidireccional entre elementos de un formulario HTML-->
            <form>
                <!-- ID -->
                <div class="mb-3">
                    <label for="idCompu" class="form-label">ID COMPU</label>
                    <input type="number" class="form-control" name="idCompu" id="idCompu" placeholder="Ej. 1, 30, 2000"
                        [(ngModel)]="compu.idCompu" disabled>
                </div>
                <!-- MARCA -->
                <div class="mb-3">
                    <label for="marca" class="form-label">MARCA</label>
                    <input type="text" class="form-control" name="marca" id="marca" placeholder="Ej. DELL, HP, ASUS"
                        [(ngModel)]="compu.marca">
                </div>
                <!-- MODELO -->
                <div class="mb-3">
                    <label for="modelo" class="form-label">MODELO</label>
                    <input type="text" class="form-control" name="modelo" id="modelo" placeholder="Ej. Inspiron, ThinkPad"
                        [(ngModel)]="compu.modelo">
                </div>
                <!-- PROCESADOR -->
                <div class="mb-3">
                    <label for="procesador" class="form-label">PROCESADOR</label>
                    <input type="text" class="form-control" name="procesador" id="procesador" placeholder="Ej. i7, AMD 3"
                        [(ngModel)]="compu.procesador">
                </div>
                <!-- RAM -->
                <div class="mb-3">
                    <label for="ram" class="form-label">RAM</label>
                    <input type="number" class="form-control" name="ram" id="ram" placeholder="Ej. 4, 8, 16"
                        [(ngModel)]="compu.ram">
                </div>
                <!-- CAPACIDAD -->
                <div class="mb-3">
                    <label for="capacidad" class="form-label">CAPACIDAD</label>
                    <input type="text" class="form-control" name="capacidad" id="capacidad" placeholder="Ej. 128GB, 256GB, 512GB"
                        [(ngModel)]="compu.capacidad">
                </div>
                <!-- COLOR -->
                <div class="mb-3">
                    <label for="color" class="form-label">COLOR</label>
                    <input type="text" class="form-control" name="color" id="color" placeholder="Ej. Rojo, Negro, Blanco"
                        [(ngModel)]="compu.color">
                </div>
                <!-- PRECIO -->
                <div class="mb-3">
                    <label for="precio" class="form-label">PRECIO</label>
                    <input type="number" class="form-control" name="precio" id="precio" placeholder="Ej. 1000, 2999, 9755"
                        [(ngModel)]="compu.precio">
                </div>
                <div class="text-center">
                    <button type="submit" class="btn btn-primary" (click)="guardarC()">GUARDAR</button>
                </div>
            </form>
        </div>
    </div>
</div>
