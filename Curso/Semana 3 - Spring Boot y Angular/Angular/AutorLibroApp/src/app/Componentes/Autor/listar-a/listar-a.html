<div class="container">
    <div class="card">
        <div class="card-header">
            <h2>AUTORES</h2>
        </div>
        <div class="card-body">
            <table class="table table-success table-striped">
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">NOMBRE</th>
                        <th scope="col">NACIONALIDAD</th>
                        <th scope="col">FECHA DE NACIMIENTO</th>
                        <th scope="col">ACCIONES</th>
                    </tr>
                </thead>
                <tbody>
                    @for (autor of autores; track autor.idAutor) {
                        <tr>
                            <td>{{autor.idAutor}}</td>
                            <td>{{autor.nombre}}</td>
                            <td>{{autor.nacionalidad}}</td>
                            <td>{{autor.fechaNacimiento}}</td>
                            <td>
                               <div class="btn-group" role="group" aria-label="Basic mixed styles example">
                                    <button type="button" class="btn btn-danger" (click)="eliminarButton(autor)">ELIMINAR</button>
                                    <button type="button" class="btn btn-warning" (click)="editarButton(autor)">EDITAR</button>
                                </div>
                            </td>
                        </tr>
                        
                    }
                    
                    @empty {
                        <div class="text-center">No existen registros</div>
                    }
                </tbody>
            </table>
        </div>
    </div>
</div>
