<div class="container">
    <div class="card">
        <div class="card-header">
            <h2>LIBROS</h2>
        </div>
        <div class="card-body">
            <table class="table table-secondary table-striped">
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">TITULO</th>
                        <th scope="col">GÉNERO</th>
                        <th scope="col">AÑO DE PUBLICACIÓN</th>
                        <th scope="col">PRECIO</th>
                        <th scope="col">AUTOR</th>
                        <th scope="col">ACCIONES</th>
                    </tr>
                </thead>
                <tbody>
                    @for (libro of libros; track libro.idLibro) {
                        <tr>
                            <td>{{libro.idLibro}}</td>
                            <td>{{libro.titulo}}</td>
                            <td>{{libro.genero}}</td>
                            <td>{{libro.anioPublicacion}}</td>
                            <td>{{libro.precio}}</td>
                            <!-- Manejador de nulos -->
                            <td>{{libro.autorId?.nombre}}</td>
                            <td>
                               <div class="btn-group" role="group" aria-label="Basic mixed styles example">
                                    <button type="button" class="btn btn-danger" (click)="eliminarButton(libro)">ELIMINAR</button>
                                    <button type="button" class="btn btn-warning" (click)="editarButton(libro)">EDITAR</button>
                                </div>
                            </td>
                        </tr>
                        
                    }
                    
                    @empty {
                        <div class="text-center">No existen registros</div>
                    }
                </tbody>
            </table>
        </div>
    </div>
</div>
