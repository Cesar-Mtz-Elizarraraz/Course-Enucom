<div class="container">
    <div class="card">
        <div class="card-header">
            <h2>PADRES</h2>
        </div>
        <div class="card-body">
            <table class="table table-ligth table-striped">
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">NOMBRE</th>
                        <th scope="col">APELLIDO</th>
                        <th scope="col">EDAD</th>
                        <th scope="col">TRABAJO</th>
                        <th scope="col">ACCIONES</th>
                    </tr>
                </thead>
                <tbody>
                    @for (padre of padres; track padre.idPadre) {
                        <tr>
                            <td>{{padre.idPadre}}</td>
                            <td>{{padre.nombre}}</td>
                            <td>{{padre.apellido}}</td>
                            <td>{{padre.edad}}</td>
                            <td>{{padre.trabajo}}</td>
                            <td>
                               <div class="btn-group" role="group" aria-label="Basic mixed styles example">
                                    <button type="button" class="btn btn-danger" (click)="eliminarButton(padre)">ELIMINAR</button>
                                    <button type="button" class="btn btn-warning" (click)="editarButton(padre)">EDITAR</button>
                                </div>
                            </td>
                        </tr>
                        
                    }
                    
                    @empty {
                        <div class="text-center">No existen registros</div>
                    }
                </tbody>
            </table>
        </div>
    </div>
</div>
