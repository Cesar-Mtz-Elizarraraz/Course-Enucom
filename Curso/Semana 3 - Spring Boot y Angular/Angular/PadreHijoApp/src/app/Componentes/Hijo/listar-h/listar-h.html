<div class="container">
    <div class="card">
        <div class="card-header">
            <h2>HIJOS</h2>
        </div>
        <div class="card-body">
            <table class="table table-ligth table-striped">
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">NOMBRE</th>
                        <th scope="col">APELLIDO</th>
                        <th scope="col">EDAD</th>
                        <th scope="col">HOBBIE</th>
                        <th scope="col">PADRE</th>
                        <th scope="col">ACCIONES</th>
                    </tr>
                </thead>
                <tbody>
                    @for (hijo of hijos; track hijo.idHijo) {
                        <tr>
                            <td>{{hijo.idHijo}}</td>
                            <td>{{hijo.nombre}}</td>
                            <td>{{hijo.apellido}}</td>
                            <td>{{hijo.edad}}</td>
                            <td>{{hijo.hobbie}}</td>
                            <!-- Manejador de nulos -->
                            <td>{{hijo.padreId?.nombre}}</td>
                            <td>
                               <div class="btn-group" role="group" aria-label="Basic mixed styles example">
                                    <button type="button" class="btn btn-danger" (click)="eliminarButton(hijo)">ELIMINAR</button>
                                    <button type="button" class="btn btn-warning" (click)="editarButton(hijo)">EDITAR</button>
                                </div>
                            </td>
                        </tr>
                        
                    }
                    
                    @empty {
                        <div class="text-center">No existen registros</div>
                    }
                </tbody>
            </table>
        </div>
    </div>
</div>
