<div class="container">
    <div class="card">
        <div class="card-header">
            <h2>Editar Hijo</h2>
        </div>
        <div class="card-body">
            <th>Ingresa los nuevos datos del hijo</th>
            <!-- ngModel: es una directiva en ANgular que proporciona en enlace bidireccional entre elementos de un formulario HTML-->
            <form>
                <!-- ID -->
                <div class="mb-3">
                    <label for="idHijo" class="form-label">ID HIJO</label>
                    <input type="number" class="form-control" name="idHijo" id="idHijo" placeholder="Ej. 1, 30, 2000"
                        [(ngModel)]="hijo.idHijo" disabled>
                </div>
                <!-- NOMBRE -->
                <div class="mb-3">
                    <label for="nombre" class="form-label">NOMBRE</label>
                    <input type="text" class="form-control" name="nombre" id="nombre" placeholder="Ej. Sergio, Camilo, Pepe"
                        [(ngModel)]="hijo.nombre">
                </div>
                <!-- APELLIDO -->
                <div class="mb-3">
                    <label for="apellido" class="form-label">APELLIDO</label>
                    <input type="text" class="form-control" name="apellido" id="apellido" placeholder="Ej. Gomez, Martinez, Mendez"
                        [(ngModel)]="hijo.apellido">
                </div>
                <!-- EDAD -->
                <div class="mb-3">
                    <label for="edad" class="form-label">EDAD</label>
                    <input type="number" class="form-control" name="edad" id="edad" placeholder="Ej. 10, 45, 60"
                        [(ngModel)]="hijo.edad">
                </div>
                <!-- HOBBIE -->
                <div class="mb-3">
                    <label for="hobbie" class="form-label">HOBBIE</label>
                    <input type="text" class="form-control" name="hobbie" id="hobbie" placeholder="Ej. Jugar, Comer, Ver videos"
                        [(ngModel)]="hijo.hobbie">
                </div>
                <!-- ID PADRE -->
                <div class="mb-3">
                    <label for="padreId" class="form-label">ID PADRE</label>
                    <input type="text" class="form-control" name="padreId" id="padreId" placeholder="Ej. 1, 5, 10"
                        [(ngModel)]="identificador">
                </div>
                <div class="text-center">
                    <button type="submit" class="btn btn-primary" (click)="editarHijo()">GUARDAR</button>
                </div>
            </form>
        </div>
    </div>
</div>
