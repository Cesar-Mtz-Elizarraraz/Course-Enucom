<div class="card w-100">
    <div class="card-body">
        <div class="d-flex mb-3 gap-3 flex-wrap">
            <div class="d-flex align-items-center gap-2 flex-grow-1 justify-content-lg-start justify-content-center">
                <span>Mostrar</span>
                <select [(ngModel)]="selectedLimit" class="form-select" style="width: 100px;">
                    @for (opcion of opciones; track $index) {
                        <option [value]="opcion.valor">
                            {{ opcion.texto }}
                        </option>
                    }
                    <option [value]="rowsTemp.length" selected>
                        Todos
                    </option>
                </select>
                <span>registros</span>
            </div>
            <div class="col-12 col-md-4 col-lg-3">
                <input
                    type="text"
                    class="form-control"
                    placeholder="Buscar"
                    (keyup)="filterRows($event)"
                />
            </div>
            
        </div>
        
        <ngx-datatable
            #table
            class="bootstrap striped"
            [rows]="rowsTemp"
            [columnMode]="'force'"
            [headerHeight]="40"
            [footerHeight]="50"
            [rowHeight]="'auto'"
            [limit]="selectedLimit">
            @for (column of tableConfig.columns; track $index) {
                <ngx-datatable-column [width]="column.width" [name]="column.name" [prop]="column.prop" [headerClass]="'text-center'" [cellClass]="'text-center'">
                        <ng-template let-value="value" ngx-datatable-cell-template>
                        @if (column.prop == tableConfig.mainProp){
                            <strong>{{ value }}</strong>
                        } @else {
                            {{ value || 'S/D' }}
                        }
                    </ng-template>
                </ngx-datatable-column>
            }
            @if (withActions) {
                <ngx-datatable-column [width]="65" name="Acciones" [headerClass]="'text-center'" [cellClass]="'text-center'">
                    <ng-template let-row="row" ngx-datatable-cell-template>
                        <div class="btn-group" role="group">
                            <button type="button" class="btn btn-warning" (click)="editar.emit(row[tableConfig.mainProp])"><fa-icon icon="pen" /></button>
                            <button type="button" class="btn btn-danger" (click)="eliminar.emit(row[tableConfig.mainProp])"><fa-icon icon="trash-can" /></button>
                        </div>
                    </ng-template>
                </ngx-datatable-column>
            }
            <div empty-content class="text-center fw-bold fs-6 py-3">Sin registros para mostrar</div>
        </ngx-datatable>
    </div>
</div>
