<div class="d-flex flex-column flex-wrap flex-md-nowrap align-items-center py-4 gap-4">
    <div class="d-flex justify-content-between w-100">
        <h2><fa-icon icon="user" /> CLIENTES</h2>
        <button type="button" class="btn btn-main" (click)="openGuardarModal(contentG)">REGISTRAR</button>
    </div>     
    <app-information-table class="w-100" 
        [rows]="clientes" 
        [tableConfig]="tableConfig" 
        [withActions]="true" 
        (editar)="onEditar($event)" 
        (eliminar)="onEliminar($event)">
    </app-information-table>
    <ng-template #contentG let-modal>
        <div class="modal-header">
            <h1 class="modal-title fs-5"><fa-icon icon="plus" /> Nuevo Cliente</h1>
            <button type="button" class="btn-close" (click)="closeModal()"></button>
        </div>
        <div class="modal-body">
            <app-guardar-cli #guardarCliComponent></app-guardar-cli>
        </div>
        <div class="modal-footer p-0 border-0">
            <button type="button" class="btn btn-success m-0 w-100 rounded-0 rounded-bottom-1 fw-bold" (click)="guardarCliComponent.guardarCliente()">ACEPTAR</button>
        </div>
    </ng-template>
    <ng-template #contentE let-modal>
        <div class="modal-header">
            <h1 class="modal-title fs-5"><fa-icon icon="pen" /> Editar Cliente</h1>
            <button type="button" class="btn-close" (click)="closeModal()"></button>
        </div>
        <div class="modal-body">
            <app-editar-cli #editarCliComponent [cliente]="clienteEditar"></app-editar-cli>
        </div>
        <div class="modal-footer p-0 border-0">
            <button type="button" class="btn btn-success m-0 w-100 rounded-0 rounded-bottom-1 fw-bold" (click)="editarCliComponent.editarCliente()">ACEPTAR</button>
        </div>
    </ng-template>
</div>
