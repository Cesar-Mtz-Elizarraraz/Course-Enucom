<html lang="es">
<head>
	<meta charset="UTF-8">
	<title>PADRES</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
	<div class="container">
		<div class="card">
			<div class="card-header"> 
				<h2>Lista de Padres</h2>
			</div>
			<div>
				<a class="btn btn-outline-dark" th:href="@{/nuevo}">Guardar</a>
			</div>
			<div class="card-body">
				<table class="table">
					<thead>
						<tr>
							<th>ID</th>
							<th>NOMBRE</th>
							<th>APELLIDO</th>
							<th>EDAD</th>
							<th>TRABAJO</th>
							<th>ACCIONES</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="padre : ${padres != null ? padres : lista}">
							<td th:text="${padre.idPadre}"></td> 
							<td th:text="${padre.nombre}"></td> 
							<td th:text="${padre.apellido}"></td> 
							<td th:text="${padre.edad}"></td>
							<td th:text="${padre.trabajo}"></td> 
							<td>
								<div>
									<a type="button" class="btn btn-primary" th:href="@{/abrirEditar/}+${padre.idPadre}">Editar</a>
									<form th:action="@{/eliminar/}+${padre.idPadre}" method="post"
									      onsubmit="return confirm('¿Estás seguro de que deseas eliminar este registro?');"
									      style="display:inline;">
									    <button type="submit" class="btn btn-danger">Eliminar</button>
									</form>
								</div>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
</body>
</html>
