<html lang="es">
<head>
	<meta charset="UTF-8">
	<title>HIJOS</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
	<div class="container py-5">
		<div class="card">
			<div class="card-header"> 
				<div class="d-flex justify-content-between align-items-center">
					<h2>Lista de Hijos</h2>
					<a class="btn btn-outline-dark" th:href="@{/hijo/nuevoH}">Guardar</a>
				</div>
			</div>
			<div class="card-body">
				<div class="d-none" th:text="${exito}" id="exito"></div>
				<table class="table">
					<thead>
						<tr>
							<th>ID</th>
							<th>NOMBRE</th>
							<th>APELLIDO</th>
							<th>EDAD</th>
							<th>HOBBIE</th>
							<th>PADRE</th>
							<th>ACCIONES</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="hijo : ${hijos != null ? hijos : lista}">
							<td th:text="${hijo.idHijo}"></td> 
							<td th:text="${hijo.nombre}"></td> 
							<td th:text="${hijo.apellido}"></td> 
							<td th:text="${hijo.edad}"></td>
							<td th:text="${hijo.hobbie}"></td> 
							<td th:text="${hijo.padreId != null ? hijo.padreId.nombre : 'SIN PADRE'}"></td> 
							<td>
								<div>
									<a type="button" class="btn btn-primary" th:href="@{/hijo/abrirEditarH/}+${hijo.idHijo}">Editar</a>
									<form th:action="@{/hijo/eliminarH/}+${hijo.idHijo}" class="form-eliminar" method="post"
									      style="display:inline;">
									    <button type="submit" class="btn btn-danger">Eliminar</button>
									</form>
								</div>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
</body>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
	document.addEventListener('DOMContentLoaded', function () {
	    const forms = document.querySelectorAll('.form-eliminar');
	
	    forms.forEach(form => {
	      form.addEventListener('submit', function (e) {
	        e.preventDefault(); // Detiene el envío inmediato
			console.log("SE ENVIA")
	        Swal.fire({
	          title: '¿Estás seguro?',
	          text: "¡Esta acción no se puede deshacer!",
	          icon: 'warning',
	          showCancelButton: true,
	          confirmButtonColor: '#d33',
	          cancelButtonColor: '#3085d6',
	          confirmButtonText: 'Sí, eliminar',
	          cancelButtonText: 'Cancelar'
	        }).then((result) => {
	          if (result.isConfirmed) {
	            form.submit(); // Envía el formulario si se confirma
	          }
	        });
	      });
	    });
		
		const exito = document.getElementById('exito');
		if (exito && exito.textContent.trim() !== '') {
	      Swal.fire({
	        icon: 'success',
	        title: 'Éxito',
	        text: exito.textContent,
	        confirmButtonColor: '#3085d6'
	      });
	    }
	  });
</script>
</html>
