services:
  oracle-db:
    image: gvenzl/oracle-xe:latest
    container_name: oracle-db
    ports:
      - '1522:1521'
    environment:
      - ORACLE_PASSWORD=12345
      - ORACLE_DATABASE=testdb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      start_period: 30s
      interval: 10s
      timeout: 10s
      retries: 3

  spring-app:
    image: padre-hijo-spring:1.0
    container_name: spring-app
    ports:
      - '8080:8001'
    environment:
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@oracle-db:1521/XE
      - SPRING_DATASOURCE_USERNAME=SYSTEM
      - SPRING_DATASOURCE_PASSWORD=12345
      - SPRING_DATASOURCE_DRIVER-CLASS-NAME=oracle.jdbc.OracleDriver
    restart: unless-stopped
    depends_on:
      oracle-db:
        condition: service_healthy
