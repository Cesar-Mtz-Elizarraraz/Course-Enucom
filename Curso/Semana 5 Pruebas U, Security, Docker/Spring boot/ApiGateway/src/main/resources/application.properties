spring.application.name=ApiGateway

# Puerto
server.port=9000

# Eureka Client
spring.cloud.service-registry.auto-registration.enabled=true

# Microservicios a gestionar
# Responsables
spring.cloud.gateway.mvc.routes[0].id=Responsables
spring.cloud.gateway.mvc.routes[0].uri=http://localhost:8010
spring.cloud.gateway.mvc.routes[0].predicates=Path=/responsable/**

# Mascotas
spring.cloud.gateway.mvc.routes[1].id=Mascotas
spring.cloud.gateway.mvc.routes[1].uri=http://localhost:8011
spring.cloud.gateway.mvc.routes[1].predicates=Path=/mascota/**

# Clientes
spring.cloud.gateway.mvc.routes[2].id=Clientes
spring.cloud.gateway.mvc.routes[2].uri=http://localhost:8012
spring.cloud.gateway.mvc.routes[2].predicates=Path=/cliente/**

# Veterinarias
spring.cloud.gateway.mvc.routes[3].id=Veterinarias
spring.cloud.gateway.mvc.routes[3].uri=http://localhost:8013
spring.cloud.gateway.mvc.routes[3].predicates=Path=/veterinaria/**

# Permitir todos los metodos de envio y a que host
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:4200
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
