<div class="d-flex">
  <div class="d-flex flex-shrink-0 p-3" style="width: 280px; height: 100vh;"></div>
    <div class="container py-4 d-flex gap-4 flex-column">
        <div class="d-flex justify-content-between">
            <h2><fa-icon [icon]="faUser" /> EMPLEADOS</h2>
            <button type="button" class="btn btn-primary" (click)="openGuardarModal(contentG)">REGISTRAR</button>
        </div>
        <div class="card">
            <div class="card-body">
                <table id="miTabla" class="table text-center m-0">
                    <thead class="table-dark">
                        <tr>
                            <th>#</th>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th>Teléfono</th>
                            <th>Puesto</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        @for (empleado of empleados; track empleado.idEmpleado) {
                            <tr>
                                <th>{{empleado.idEmpleado}}</th>
                                <td>{{empleado.nombre}}</td>
                                <td>{{empleado.apellido}}</td>
                                <td>{{empleado.telefono}}</td>
                                <td>{{empleado.puesto}}</td>
                                <td>
                                    <div class="btn-group" role="group" aria-label="Basic mixed styles example">
                                        <button type="button" class="btn btn-danger" (click)="eliminarEmpleado(empleado)"><fa-icon [icon]="faTrasCan" /> ELIMINAR</button>
                                        <button type="button" class="btn btn-warning" (click)="openEditarModal(contentE, empleado)"><fa-icon [icon]="faPen" /> EDITAR</button>
                                    </div>
                                </td>
                            </tr>
                        }
                        
                        @empty {
                            <div class="text-center">No existen registros</div>
                        }
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <ng-template #contentG let-modal>
        <div class="modal-header">
            <h1 class="modal-title fs-5"><fa-icon [icon]="faPlus" /> Nuevo Empleado</h1>
            <button type="button" class="btn-close" (click)="closeGuardarModal()"></button>
        </div>
        <div class="modal-body">
            <app-guardar-e #guardarEComponent></app-guardar-e>
        </div>
        <div class="modal-footer p-0 border-0">
            <button type="button" class="btn btn-success m-0 w-100 rounded-0 rounded-bottom-1 fw-bold" (click)="guardarEComponent.guardarEmpleado()">ACEPTAR</button>
        </div>
    </ng-template>
    <ng-template #contentE let-modal>
        <div class="modal-header">
            <h1 class="modal-title fs-5"><fa-icon [icon]="faPen" /> Editar Empleado</h1>
            <button type="button" class="btn-close" (click)="closeEditarModal()"></button>
        </div>
        <div class="modal-body">
            <app-editar-e [empleado]="empleadoEditar" #editarEComponent></app-editar-e>
        </div>
        <div class="modal-footer p-0 border-0">
            <button type="button" class="btn btn-success m-0 w-100 rounded-0 rounded-bottom-1 fw-bold" (click)="editarEComponent.editarEmpleado()">ACEPTAR</button>
        </div>
    </ng-template>
</div>
