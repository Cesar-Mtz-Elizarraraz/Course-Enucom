<div class="d-flex">
  <div class="d-flex flex-shrink-0 p-3" style="width: 280px; height: 100vh;"></div>
    <div class="container py-4 d-flex gap-4 flex-column">
        <div class="d-flex justify-content-between">
            <h2><fa-icon [icon]="faTags" /> CATEGORÍAS</h2>
            <button type="button" class="btn btn-primary" (click)="openGuardarModal(contentG)">REGISTRAR</button>
        </div>
        <div class="card">
            <div class="card-body">
                <table id="miTabla" class="table text-center m-0">
                    <thead class="table-dark">
                        <tr>
                            <th>#</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        @for (categoria of categorias; track categoria.idCategoria) {
                            <tr>
                                <th>{{categoria.idCategoria}}</th>
                                <td>{{categoria.nombre}}</td>
                                <td>{{categoria.descripcion}}</td>
                                <td>
                                    <div class="btn-group" role="group" aria-label="Basic mixed styles example">
                                        <button type="button" class="btn btn-danger" (click)="eliminarCategoria(categoria)"><fa-icon [icon]="faTrasCan" /> ELIMINAR</button>
                                        <button type="button" class="btn btn-warning" (click)="openEditarModal(contentE, categoria)"><fa-icon [icon]="faPen" /> EDITAR</button>
                                    </div>
                                </td>
                            </tr>
                        }
                        
                        @empty {
                            <div class="text-center">No existen registros</div>
                        }
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <ng-template #contentG let-modal>
        <div class="modal-header">
            <h1 class="modal-title fs-5"><fa-icon [icon]="faPlus" /> Nueva Categoría</h1>
            <button type="button" class="btn-close" (click)="closeGuardarModal()"></button>
        </div>
        <div class="modal-body">
            <app-guardar-c #guardarCComponent></app-guardar-c>
        </div>
        <div class="modal-footer p-0 border-0">
            <button type="button" class="btn btn-success m-0 w-100 rounded-0 rounded-bottom-1 fw-bold" (click)="guardarCComponent.guardarCategoria()">ACEPTAR</button>
        </div>
    </ng-template>
    <ng-template #contentE let-modal>
        <div class="modal-header">
            <h1 class="modal-title fs-5"><fa-icon [icon]="faPen" /> Editar Categoría</h1>
            <button type="button" class="btn-close" (click)="closeEditarModal()"></button>
        </div>
        <div class="modal-body">
            <app-editar-c [categoria]="categoriaEditar" #editarCComponent></app-editar-c>
        </div>
        <div class="modal-footer p-0 border-0">
            <button type="button" class="btn btn-success m-0 w-100 rounded-0 rounded-bottom-1 fw-bold" (click)="editarCComponent.editarCategoria()">ACEPTAR</button>
        </div>
    </ng-template>
</div>
