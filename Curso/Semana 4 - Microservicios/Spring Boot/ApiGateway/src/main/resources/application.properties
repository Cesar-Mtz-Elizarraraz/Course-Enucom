spring.application.name=ApiGateway
server.port=9000
# El apigateway es un componente en la aqrquitectura de microservicios que actua como un puerto de entrada unico
# para gestionar todas las olciiitudes hacia los microservicios backend, La funcion principal es intermediar, enrutar y gestionar
# el trafico de los clientes y MS

# Habilitarlo con eureka Client
spring.cloud.service-registry.auto-registration.enabled=true

# Configuracion de los servicios a registrar y gestionar
# Empleado
spring.cloud.gateway.mvc.routes[0].id=Empleado
spring.cloud.gateway.mvc.routes[0].uri=http://localhost:8015
spring.cloud.gateway.mvc.routes[0].predicates=Path=/E/**

spring.cloud.gateway.mvc.routes[1].id=Categoria
spring.cloud.gateway.mvc.routes[1].uri=http://localhost:8011
spring.cloud.gateway.mvc.routes[1].predicates=Path=/C/**

spring.cloud.gateway.mvc.routes[2].id=Cliente
spring.cloud.gateway.mvc.routes[2].uri=http://localhost:8014
spring.cloud.gateway.mvc.routes[2].predicates=Path=/Cli/**

spring.cloud.gateway.mvc.routes[3].id=Producto
spring.cloud.gateway.mvc.routes[3].uri=http://localhost:8010
spring.cloud.gateway.mvc.routes[3].predicates=Path=/P/**

spring.cloud.gateway.mvc.routes[4].id=Proveedor
spring.cloud.gateway.mvc.routes[4].uri=http://localhost:8012
spring.cloud.gateway.mvc.routes[4].predicates=Path=/Prov/**

spring.cloud.gateway.mvc.routes[5].id=Ventas
spring.cloud.gateway.mvc.routes[5].uri=http://localhost:8013
spring.cloud.gateway.mvc.routes[5].predicates=Path=/V/**

# En application.properties
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:4200
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
