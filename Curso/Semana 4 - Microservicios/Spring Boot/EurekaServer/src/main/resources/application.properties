spring.application.name=EurekaServer

# Configuracion del puerto
server.port=8761

# Configuracion del host donde se estara ejecutando el servidor de eureka
eureka.instance.hostname=localhost
# Especificar el url del servidor al que debe conectarse y descubrir otros microservicios
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
# Indicar que el cliente no debe registrarse en el servidor
eureka.client.register-with-eureka=false
# El cliente no debe obtener el registro de los demas servicios de eureka
eureka.client.fetch-registry=false
# Ayudar al servidor contra la perdida de demasiadas instancias en caso de red inestable o problemas temporales de comunicacion
eureka.server.enable-self-preservation=true

# Exponer todos los endpoint de administracion
management.endpoints.web.exposure.include=*
# Mostrar el detalle completo del estado de la salud de la aplicacion
management.endpoint.health.show-details=always
