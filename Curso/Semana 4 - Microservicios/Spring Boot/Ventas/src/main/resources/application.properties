spring.application.name=Ventas

# Puerto
server.port=8013

spring.datasource.url=jdbc:oracle:thin:@localhost:1521/xe
spring.datasource.username=CESARMARTINEZ
spring.datasource.password=CESARM
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.database=oracle
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hiabernate.format-sql=true

logging.level.org.hibernate.sql=debug
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=trace

# Configuracion del host donde se estara ejecutando el servidor de eureka
eureka.instance.hostname=localhost
# Especificar el url del servidor al que debe conectarse y descubrir otros microservicios
eureka.client.service-url.defaultZone=http://localhost:8761/eureka